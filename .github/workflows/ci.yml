name: Cyber-Grid CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Code Quality & Syntax Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cyber-grid

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install

      - name: Run Syntax & Module Verification
        run: npm test

      - name: Verify Frontend Assets
        run: |
          test -f public/index.html || exit 1
          test -f public/css/style.css || exit 1
          test -f public/js/app.js || exit 1
          test -f public/js/canvas.js || exit 1
          test -f public/js/socket.js || exit 1
          echo "All frontend static assets verified."

      - name: CI Success Banner
        run: echo "CI Pipeline Passed! Code is verified."