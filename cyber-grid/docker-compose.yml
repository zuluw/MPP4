services:
  db:
    image: postgres:16-alpine
    container_name: cyber_grid_db
    restart: always
    environment:
      POSTGRES_USER: cyber_user
      POSTGRES_PASSWORD: cyber_password
      POSTGRES_DB: cyber_grid_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    container_name: cyber_grid_app
    restart: always
    depends_on:
      - db
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cyber_user:cyber_password@db:5432/cyber_grid_db
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
      - ./server:/app/server

volumes:
  pgdata: